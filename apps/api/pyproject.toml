[project]
name = "my-bot-api"
version = "0.1.0"
description = "HTTP API for myBOT."
requires-python = ">=3.14"
dependencies = [
    "alembic==1.19.1",
    "authlib==1.7.2",
    "email-validator==2.3.0",
    "fastapi[standard]==0.141.1",
    "httpx==0.28.1",
    "itsdangerous==2.2.0",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.15.0",
    "redis[hiredis]==8.1.0",
    "resend==2.40.2",
    "sqlalchemy[asyncio]==2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis[lua]==2.37.1",
    "httpx2==2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "integration: requires the dedicated PostgreSQL and Redis services",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
