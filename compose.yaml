services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: mybot
      POSTGRES_PASSWORD: mybot
      POSTGRES_USER: mybot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mybot -d mybot"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - mybot-postgres:/var/lib/postgresql

  redis:
    image: redis:8.6.5-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - mybot-redis:/data

volumes:
  mybot-postgres:
  mybot-redis:
